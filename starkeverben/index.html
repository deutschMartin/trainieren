function start(obj,mode){obj.mode=mode;obj.n=0;obj.score=0;obj.checked=false;obj.items=shuffle(verbs).slice(0,10).map(v=>({v,field:mode==="all"?fields[Math.floor(Math.random()*3)]:mode}));}
function promptHtml(obj,isTraining){
 if(obj.n>=10){let el=isTraining?"#trainingArea":"#practiceArea";$(el).innerHTML=`<div class="result"><div class="big">${obj.score} / 10</div><h2>${obj.score>=8?"Sehr gut!":"Weiter üben!"}</h2><p class="hint">Bon travail. Recommence pour consolider les formes.</p><button class="primary" onclick="${isTraining?"restartTraining()":"restartPractice()"}">Recommencer</button></div>`;return}
 let item=obj.items[obj.n],v=item.v,field=item.field;
 let el=isTraining?"#trainingArea":"#practiceArea";
 let prompt=isTraining?`${v.inf}`:`${v.inf}`;
 let sub=isTraining?"Traduis mentalement, puis écris la forme demandée.":v.meaning;
 $(el).innerHTML=`<div class="question"><div class="promptlabel">${labels[field]}</div><div class="prompt" translate="no">${prompt}</div><div class="translation">${sub}</div></div><div class="answerrow"><input id="${isTraining?"trainingAnswer":"practiceAnswer"}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="er …" aria-label="Forme verbale"><button class="primary" id="checkBtn">Vérifier</button></div><div id="feedback"></div><div class="actions"><span class="score">Score : <b>${obj.score}</b> / ${obj.n+(obj.checked?1:0)}</span><button class="secondary" id="nextBtn" ${obj.checked?"":"hidden"}>${obj.n===9?"Voir le résultat":"Question suivante →"}</button></div>`;
 const input=$("#"+(isTraining?"trainingAnswer":"practiceAnswer"));
 const check=()=>{if(obj.checked)return;let answer=norm(input.value),correct=norm(v[field]);let ok=answer===correct||answer===correct.replace(/^er /,"");obj.checked=true;if(ok)obj.score++;$("#feedback").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"Richtig!":"Noch nicht."} ${!ok?`Réponse : <b translate="no">${v[field]}</b>`:""}</div>`;$("#checkBtn").disabled=true;$("#nextBtn").hidden=false;};
 $("#checkBtn").onclick=check;input.addEventListener("keydown",e=>{if(e.key==="Enter"){if(obj.checked)$("#nextBtn").click();else check()}});
 $("#nextBtn").onclick=()=>{obj.n++;obj.checked=false;promptHtml(obj,isTraining)};
 input.focus();
}
function restartPractice(){start(practice,practice.mode);promptHtml(practice,false)}
function restartTraining(){start(training,training.mode);promptHtml(training,true)}
document.querySelectorAll("#practiceModes .choice").forEach(b=>b.onclick=()=>{document.querySelectorAll("#practiceModes .choice").forEach(x=>x.classList.toggle("active",x===b));start(practice,b.dataset.mode);promptHtml(practice,false)});
document.querySelectorAll("#trainingModes .choice").forEach(b=>b.onclick=()=>{document.querySelectorAll("#trainingModes .choice").forEach(x=>x.classList.toggle("active",x===b));start(training,b.dataset.mode);promptHtml(training,true)});
start(practice,"present");promptHtml(practice,false);
start(training,"all");promptHtml(training,true);
renderCards();
</script>
</body></html>
