<!DOCTYPE html>
<html lang="de" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutschland, eine lebendige Demokratie</title>
<style>
:root {
  --bg:#f4f6f8; --surface:#ffffff; --ink:#202b3c; --muted:#687588;
  --line:#e1e7ee; --accent:#315f91; --ok:#237653; --okbg:#e6f4ed;
  --bad:#b64b43; --badbg:#fbecea;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#151d29; --surface:#202b3a; --ink:#edf1f6; --muted:#a5b1c1; --line:#39485b; --accent:#83add8; --ok:#65c69a; --okbg:#1c3b30; --bad:#ee9187; --badbg:#442825; color-scheme:dark; }
}
:root[data-theme="dark"] { --bg:#151d29; --surface:#202b3a; --ink:#edf1f6; --muted:#a5b1c1; --line:#39485b; --accent:#83add8; --ok:#65c69a; --okbg:#1c3b30; --bad:#ee9187; --badbg:#442825; color-scheme:dark; }
html { scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; text-size-adjust:100%; }
*, *::before, *::after { box-sizing:inherit; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.55; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; overflow-x:hidden; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
main { width:calc(100% - 40px); max-width:1120px; margin:0 auto; padding:22px 0 28px; }
h1 { font-size:clamp(1.45rem,4vw,1.9rem); line-height:1.2; letter-spacing:-.035em; margin:8px 0 0; text-align:center; font-weight:750; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
.flagge { display:inline-flex; flex:0 0 auto; width:36px; height:24px; border-radius:3px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.22); background:linear-gradient(to bottom,#111 0 33.333%,#dd0000 33.333% 66.666%,#ffce00 66.666% 100%); }
.sub { text-align:center; color:var(--muted); font-size:.88rem; margin:8px 0 22px; }
.fr, .francais { font-style:italic; }
.tabs { position:sticky; top:env(safe-area-inset-top,0px); z-index:11; background:var(--bg); display:flex; gap:7px; overflow-x:auto; padding:10px 0 12px; border-bottom:1px solid var(--line); }
.tab { flex:none; padding:9px 14px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--muted); font:inherit; font-size:.88rem; font-weight:600; cursor:pointer; transition:background .15s,border-color .15s,color .15s; }
.tab.on { border-color:var(--accent); background:var(--accent); color:#fff; }
.workspace { display:grid; grid-template-columns:238px minmax(0,1fr); gap:24px; align-items:start; padding-top:16px; }
.workspace.result-only { grid-template-columns:minmax(0,1fr); }
.exercise-nav { position:sticky; top:76px; align-self:start; padding:13px; border:1px solid var(--line); border-radius:13px; background:var(--surface); }
.exercise-nav[hidden] { display:none !important; }
.nav-heading { margin:1px 5px 10px; color:var(--muted); font-size:.76rem; font-weight:750; letter-spacing:.07em; text-transform:uppercase; }
#exerciseList { display:grid; gap:5px; }
.exercise-link { display:flex; align-items:center; gap:8px; width:100%; min-height:42px; padding:9px 10px; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--ink); text-align:left; font:inherit; font-size:.87rem; line-height:1.3; cursor:pointer; }
.exercise-link:hover { background:var(--bg); }
.exercise-link.on { border-color:var(--line); background:var(--bg); color:var(--accent); font-weight:700; }
.exercise-link .check { margin-left:auto; color:var(--ok); font-weight:800; }
.lesson { min-width:0; }
.lesson .total { margin-top:0; }
.intro { margin:18px 0 8px; font-size:1.03rem; font-weight:650; letter-spacing:-.01em; }
.stat { font-weight:700; margin:0 0 13px; color:var(--accent); font-size:.9rem; }
.carte { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(25,45,70,.035); }
.q { margin:0 0 12px; font-weight:650; line-height:1.45; }
.opts { display:grid; gap:8px; }
.opt { text-align:left; padding:11px 13px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font:inherit; font-size:.92rem; cursor:pointer; transition:border-color .15s,background .15s; }
.opt:disabled { opacity:1; color:var(--ink); cursor:default; }
.opt.juste { border-color:var(--ok); background:var(--okbg); }
.opt.faux { border-color:var(--bad); background:var(--badbg); animation:secoue .4s; }
.expl { margin:11px 0 0; font-size:.86rem; color:var(--muted); }
.texte { line-height:2.35; white-space:pre-line; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; }
select { font:inherit; font-size:16px; padding:8px 10px; margin:0 2px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); max-width:100%; min-height:42px; }
select.juste { border-color:var(--ok); background:var(--okbg); }
select.faux { border-color:var(--bad); background:var(--badbg); }
.act { margin-top:14px; width:100%; padding:12px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:650; cursor:pointer; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
@keyframes secoue { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }
@media (prefers-reduced-motion: reduce) { .opt.faux { animation:none; } }
.total { margin:14px 0 0; font-weight:650; font-size:.86rem; color:var(--muted); }
.barre { height:7px; background:var(--line); border-radius:10px; overflow:hidden; margin:8px 0 10px; }
.barre i { display:block; height:100%; width:0; background:var(--ok); border-radius:10px; transition:width .3s; }
@media (prefers-reduced-motion: reduce) { .barre i { transition:none; } }
.opt, .act, .tab { min-height:44px; }
.tabs { -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.alerte { margin:10px 0; padding:12px 14px; border:1px solid var(--bad); border-radius:9px; background:var(--badbg); font-weight:600; font-size:.92rem; }
.alerte[hidden] { display:none; }
@media (max-width:700px) {
  main { width:100%; padding:16px 13px 26px; }
  .tab { padding:8px 11px; font-size:.82rem; }
  .tabs { gap:5px; }
  .carte { padding:13px; }
  h1 { gap:9px; }
  .flagge { width:30px; height:20px; }
  .workspace { display:flex; flex-direction:column; gap:12px; padding-top:12px; }
  .exercise-nav { position:static; width:100%; padding:10px; }
  .nav-heading { margin:0 4px 7px; }
  #exerciseList { display:flex; gap:6px; overflow-x:auto; padding:1px 1px 5px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  #exerciseList::-webkit-scrollbar { display:none; }
  .exercise-link { flex:0 0 auto; width:auto; max-width:220px; min-height:40px; white-space:nowrap; border-color:var(--line); background:var(--surface); }
  .exercise-link.on { border-color:var(--accent); background:var(--accent); color:#fff; }
  .exercise-link .check { color:var(--ok); }
  .exercise-link.on .check { color:#fff; }
}
.footer { margin:28px 0 4px; padding-top:14px; border-top:1px solid var(--line); text-align:center; color:var(--muted); font-size:.82rem; font-weight:600; letter-spacing:.04em; }
@media print { body { display:none !important; } }
</style>
</head>
